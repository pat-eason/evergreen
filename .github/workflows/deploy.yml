name: CI & Deploy

# Pull requests: run the tests and build.
# Pushes to main: also build and publish the images, deploy them to the shared droplet, and publish the
# /evergreen route to the shared proxy (droplet-infra), served at https://apps.pateason.dev/evergreen/. Run it by hand (Actions -> Run workflow) to redeploy, or re-run an older
# run to roll back.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once, and never cancel one midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: API format, vet & tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
          go vet ./...
          go build ./...
          go test -race -count=1 ./...

      - name: Enable pnpm (version pinned by frontend/package.json)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Web typecheck & build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  images:
    name: Build & push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.names.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Registry name (must be lowercase)
        id: names
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.registry }}/evergreen-api:${{ github.sha }}
          # links the package to this repository so the deploy job's token may pull it
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.names.outputs.registry }}/evergreen-web:${{ github.sha }}
          # served at https://apps.pateason.dev/evergreen/ behind the shared proxy
          build-args: BASE_PATH=/evergreen/
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to droplet
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to the "production" environment in GitHub if you want a manual gate.
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_DIR: /opt/evergreen
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
          PORT: ${{ secrets.DROPLET_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host droplet
            HostName $HOST
            User $SSH_USER
            Port ${PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONF

      - name: Sync compose files and scripts
        run: |
          scp docker-compose.yml docker-compose.prod.yml deploy/backup.sh deploy/restore.sh "droplet:${DEPLOY_DIR}/"
          ssh droplet "chmod +x '${DEPLOY_DIR}/backup.sh' '${DEPLOY_DIR}/restore.sh'"

      - name: Log the droplet in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | ssh droplet "docker login ghcr.io -u '$ACTOR' --password-stdin"

      - name: Pull images and restart
        env:
          REGISTRY: ${{ needs.images.outputs.registry }}
          TAG: ${{ github.sha }}
          # open | invite | closed (defaults to closed if the secret is unset).
          REGISTRATION_MODE: ${{ secrets.REGISTRATION_MODE }}
          REGISTRATION_INVITE_CODE: ${{ secrets.REGISTRATION_INVITE_CODE }}
        run: |
          ssh droplet "REGISTRY='$REGISTRY' TAG='$TAG' REGISTRATION_MODE='${REGISTRATION_MODE:-closed}' REGISTRATION_INVITE_CODE='${REGISTRATION_INVITE_CODE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/evergreen
          # First deploy only: create .env with a random database password. Never overwritten afterwards,
          # because Postgres reads its password when the volume is first created.
          if [ ! -f .env ]; then
            umask 077
            {
              printf 'POSTGRES_PASSWORD=%s\n' "$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
              # pin the project (so the data volume is always evergreen_pgdata) and the layered files,
              # so manual `docker compose ...`, backup.sh and restore.sh behave like the deploy
              echo 'COMPOSE_PROJECT_NAME=evergreen'
              echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml'
            } > .env
          fi
          set_env() { # update or append KEY=VALUE without touching the other lines
            if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else printf '%s=%s\n' "$1" "$2" >> .env; fi
          }
          # Back up before changing anything. If the database is up and the backup fails, stop.
          if docker compose ps --status running --services 2>/dev/null | grep -qx db; then
            ./backup.sh
          fi
          # Remember what is running so manual compose commands use the same images.
          set_env REGISTRY "$REGISTRY"
          set_env TAG "$TAG"
          export REGISTRATION_MODE REGISTRATION_INVITE_CODE   # not stored in .env; re-applied from the secrets each deploy
          docker compose pull api web
          docker compose up -d --no-build --remove-orphans
          echo "waiting for the API to report healthy..."
          for i in $(seq 1 30); do
            if docker compose exec -T api wget -qO- http://127.0.0.1:8081/api/health >/dev/null 2>&1; then
              echo "healthy"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose ps
          docker compose logs --tail 50 api
          exit 1
          REMOTE

      - name: Remove stored registry credentials
        if: always()
        run: ssh droplet "docker logout ghcr.io" || true

      # Last step: publish this app's route to the shared proxy. proxy-site validates the whole Caddy
      # config and rolls back if the snippet is invalid, so a mistake can't take the other apps down.
      - name: Publish route to the shared proxy
        run: ssh droplet "proxy-site install evergreen" < deploy/evergreen.caddy
