name: CI/CD

# Pull requests: run the tests and build.
# Pushes to main: also build and publish the images, then deploy to the droplet.
# Run it by hand (Actions tab -> Run workflow) to redeploy main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend vet and tests
        working-directory: backend
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Enable pnpm (version pinned by frontend/package.json)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.names.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Image registry name (must be lowercase)
        id: names
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/evergreen-api:${{ github.sha }}
            ${{ steps.names.outputs.registry }}/evergreen-api:latest
          # links the package to this repository so the deploy job's token may pull it
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/evergreen-web:${{ github.sha }}
            ${{ steps.names.outputs.registry }}/evergreen-web:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create a "production" environment in the repo settings to add required reviewers
    # (a manual approval before each deploy) or to scope the secrets below to it.
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/evergreen' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key is pinned from a secret rather than trusted on first use.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose file and scripts
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            docker-compose.yml deploy/deploy.sh deploy/backup.sh deploy/restore.sh \
            "$TARGET:$DEPLOY_PATH/"
          $SSH "$TARGET" "chmod +x '$DEPLOY_PATH'/deploy.sh '$DEPLOY_PATH'/backup.sh '$DEPLOY_PATH'/restore.sh"

      - name: Deploy
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ needs.images.outputs.registry }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # The registry token goes over stdin so it never appears in a process list or log.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$TARGET" "cd '$DEPLOY_PATH' && ./deploy.sh '$SHA' '$REGISTRY' '$ACTOR'"

      - name: Health check
        if: ${{ vars.DEPLOY_URL != '' }}
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            "$DEPLOY_URL/api/health"
