# Local:       docker compose up --build        (http://localhost:8080)
# Production:  see DEPLOY.md and .env.example
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_PATH: /data/wellness.db
      # "false" locks sign-ups once the first account exists
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - wellness-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # ":80" = plain HTTP; a domain name = automatic HTTPS
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy-data:/data    # certificates: keep this or Let's Encrypt rate limits bite
      - caddy-config:/config

volumes:
  wellness-data:
  caddy-data:
  caddy-config:
