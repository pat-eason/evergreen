# Local:       docker compose up --build        (http://localhost:8080)
# Production:  layered with docker-compose.prod.yml on the shared droplet (see DEPLOY.md):
#                COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evergreen
      POSTGRES_DB: evergreen
      # Only read when the volume is first created. Set a real one in .env for production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evergreen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergreen -d evergreen"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Loopback only: handy for local tools and `go run`; never reachable from outside the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    build: ./backend
    # On the droplet these are pulled from the registry (see DEPLOY.md); locally
    # `docker compose up --build` builds and tags them under the same names.
    image: ${REGISTRY:-ghcr.io/pat-eason}/evergreen-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Point this at any Postgres (e.g. a DigitalOcean Managed Database) to use that instead.
      DATABASE_URL: ${DATABASE_URL:-postgres://evergreen:${POSTGRES_PASSWORD:-evergreen}@db:5432/evergreen?sslmode=disable}
      # "false" locks sign-ups once the first account exists
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        # public path of the SPA; the droplet image is built with /evergreen/ (see DEPLOY.md)
        BASE_PATH: ${BASE_PATH:-/}
    image: ${REGISTRY:-ghcr.io/pat-eason}/evergreen-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # ":80" = plain HTTP; a domain name = automatic HTTPS (standalone use only; on the
      # shared droplet the prod overlay pins ":80" and the shared proxy does the HTTPS)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy-data:/data    # certificates: keep this or Let's Encrypt rate limits bite
      - caddy-config:/config

volumes:
  pgdata:       # the database; deleting this volume deletes all data
  caddy-data:
  caddy-config:
